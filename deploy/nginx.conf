server {
    listen 80;
    listen [::]:80;
    server_name arehmansons.com www.arehmansons.com;  # change when domain is ready

    root /var/www/a-rehman-sons;
    index index.html;

    # Static site — no build step
    location / {
        try_files $uri $uri/ =404;
    }

    # PDF catalog (~20 MB) — allow download
    location ~* \.pdf$ {
        add_header Content-Disposition "attachment";
        expires 7d;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}

# After DNS is ready, enable HTTPS:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d arehmansons.com -d www.arehmansons.com
