<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A. Rehman and Sons ARS Logo">
  <defs>
    <linearGradient id="ovalFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="45%" stop-color="#c49a6c"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <linearGradient id="letterFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddd0f0"/>
      <stop offset="100%" stop-color="#b49fd4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003366" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background blue swoosh -->
  <path d="M420 430 C300 360 250 300 210 220 C190 180 180 130 190 80" fill="none" stroke="#003366" stroke-width="34" stroke-linecap="round"/>
  <path d="M450 460 C320 390 265 325 220 245 C198 205 188 150 198 98" fill="none" stroke="#0066b3" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

  <g filter="url(#softShadow)">
    <!-- Green swoosh -->
    <path d="M118 300 C170 350 230 372 292 360 C250 338 205 318 118 300 Z" fill="none" stroke="#00a3a1" stroke-width="18" stroke-linecap="round"/>
    <!-- Pink swoosh -->
    <path d="M394 152 C340 108 280 88 220 96 C262 118 320 132 394 152 Z" fill="none" stroke="#a83279" stroke-width="18" stroke-linecap="round"/>

    <!-- Oval -->
    <ellipse cx="256" cy="256" rx="178" ry="118" fill="url(#ovalFill)"/>
    <ellipse cx="256" cy="256" rx="178" ry="118" fill="none" stroke="#8b6914" stroke-width="3" opacity="0.25"/>

    <!-- ARS letters -->
    <text x="256" y="292" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="118" font-weight="900" fill="url(#letterFill)" stroke="#ffffff" stroke-width="8" paint-order="stroke fill">ARS</text>
  </g>
</svg>
