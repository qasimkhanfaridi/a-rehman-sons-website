<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="A. Rehman and Sons ARS Logo">
  <!-- Faithful recreation of the original ARS logo: tan oval, lavender ARS, magenta top-right arc, green bottom-left arc -->

  <!-- Main oval -->
  <ellipse cx="210" cy="140" rx="178" ry="102" fill="#c8a56e"/>

  <!-- Magenta arc — top-right edge of oval -->
  <path
    fill="none"
    stroke="#c4007a"
    stroke-width="7"
    stroke-linecap="round"
    d="M 355 78
       A 178 102 0 0 0 285 48
       A 178 102 0 0 0 210 38"/>

  <!-- Green arc — bottom-left edge of oval -->
  <path
    fill="none"
    stroke="#1a6b35"
    stroke-width="7"
    stroke-linecap="round"
    d="M 65 202
       A 178 102 0 0 0 135 232
       A 178 102 0 0 0 210 242"/>

  <!-- ARS letters — rounded bold sans, lavender fill, white outline -->
  <text
    x="210"
    y="162"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    fill="#b8a4d4"
    stroke="#ffffff"
    stroke-width="9"
    paint-order="stroke fill"
    letter-spacing="-2">ARS</text>
</svg>
